spring:
  application:
    name: currency-rates
  datasource:
    url: jdbc:h2:file:./data/currency-rates;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
collector:
  enabled: true
  interval: PT6H
  audit-file: ./logs/collections.log
