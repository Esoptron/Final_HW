spring:
  application:
    name: currency-rates
  datasource:
    url: jdbc:h2:file:./data/currency-rates;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
collector:
  enabled: true
  interval: PT6H
  audit-file: ./logs/collections.log
rates:
  fallback-enabled: true
  cbr-url: https://www.cbr.ru/scripts/XML_daily.asp
observability:
  log-stages: false
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  info:
    env:
      enabled: true
  tracing:
    enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "currency.parse.duration": true
        "currency.collection": true
info:
  app:
    name: Currency Rates
